<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ElderCare Connect - Complete Care Management</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; }
  body { background: #f0f4f8; color: #1e293b; }
  .btn-large { min-height: 60px; font-size: 18px; font-weight: 600; }
  .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .suggestion-item { cursor: pointer; padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
  .suggestion-item:hover { background: #f1f5f9; }
  .day-btn { min-width: 42px; padding: 8px 4px; border-radius: 8px; font-weight: 600; font-size: 12px; }
  .form-label { font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; display: block; margin-top: 14px; }
  .form-input { width: 100%; border: 2px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; font-size: 15px; outline: none; }
  .form-input:focus { border-color: #2563eb; }
</style>
</head>
<body class="min-h-screen">

<header class="bg-blue-600 text-white py-4 px-4 shadow-md sticky top-0 z-40">
  <div class="max-w-4xl mx-auto flex justify-between items-center">
    <h1 class="text-lg md:text-2xl font-bold">🏥 ElderCare Connect</h1>
    <button onclick="toggleLanguage()" id="langBtn" class="text-xs bg-white/20 px-3 py-1 rounded-lg font-semibold">हिंदी</button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-6 space-y-5">

  <button onclick="emergencyAlert()" class="w-full bg-red-500 hover:bg-red-600 text-white btn-large rounded-2xl shadow-lg transition">
    🚨 <span class="lang" data-en="EMERGENCY - Alert Family" data-hi="आपातकाल - परिवार को सूचित करें">EMERGENCY - Alert Family</span>
  </button>

  <div class="card">
    <h2 class="text-lg font-bold mb-4 text-slate-800">👤 <span class="lang" data-en="Senior Profile" data-hi="वरिष्ठ प्रोफ़ाइल">Senior Profile</span></h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <input id="seniorName" type="text" placeholder="Senior's Name" class="form-input">
      <input id="seniorAge" type="number" placeholder="Age" class="form-input">
    </div>
    <button onclick="saveProfile()" class="mt-3 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold">Save Profile</button>
    <p id="profileStatus" class="mt-2 text-sm text-green-600 hidden">✅ Profile saved!</p>
  </div>

  <div class="card">
    <h2 class="text-lg font-bold mb-4 text-slate-800">📅 <span class="lang" data-en="Week View" data-hi="सप्ताह दृश्य">Week View</span></h2>
    <div class="grid grid-cols-7 gap-1">
      <button onclick="setDay(0)" id="day-0" class="day-btn">Sun</button>
      <button onclick="setDay(1)" id="day-1" class="day-btn">Mon</button>
      <button onclick="setDay(2)" id="day-2" class="day-btn">Tue</button>
      <button onclick="setDay(3)" id="day-3" class="day-btn">Wed</button>
      <button onclick="setDay(4)" id="day-4" class="day-btn">Thu</button>
      <button onclick="setDay(5)" id="day-5" class="day-btn">Fri</button>
      <button onclick="setDay(6)" id="day-6" class="day-btn">Sat</button>
    </div>
  </div>

  <div class="card">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-bold text-slate-800">💊 <span class="lang" data-en="Medicines" data-hi="दवाइयाँ">Medicines</span> - <span id="timelineDay">Sunday</span></h2>
      <button onclick="addMedicine()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">+ Add</button>
    </div>
    <div class="space-y-4">
      <div><h3 class="text-sm font-bold text-orange-600 mb-2">🌅 Morning</h3><div id="morningList" class="space-y-2"></div></div>
      <div><h3 class="text-sm font-bold text-yellow-600 mb-2">☀️ Afternoon</h3><div id="afternoonList" class="space-y-2"></div></div>
      <div><h3 class="text-sm font-bold text-purple-600 mb-2">🌆 Evening</h3><div id="eveningList" class="space-y-2"></div></div>
      <div><h3 class="text-sm font-bold text-indigo-600 mb-2">🌙 Night</h3><div id="nightList" class="space-y-2"></div></div>
    </div>
    <p id="noMedicine" class="text-slate-400 text-center py-4">No medicines added yet.</p>
  </div>

  <div class="card">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-bold text-slate-800">✅ <span class="lang" data-en="Caregiver Tasks" data-hi="देखभाल कार्य">Caregiver Tasks</span></h2>
      <button onclick="addTask()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">+ Add</button>
    </div>
    <div id="taskList" class="space-y-3"></div>
    <p id="noTask" class="text-slate-400 text-center py-4">No tasks yet.</p>
  </div>

</main>

<footer class="text-center text-slate-400 text-sm py-6">
  © 2026 ElderCare Connect • Made with ❤️
</footer>

<div id="medicineModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 z-50">

    <h3 class="text-lg font-bold mb-2">💊 <span class="lang" data-en="Add Medicine" data-hi="दवा जोड़ें">Add Medicine</span></h3>

    <label class="form-label">Medicine Name</label>
    <input id="medicineSearch" type="text" placeholder="Type 2 letters (e.g., Para, Vicks)" class="form-input" oninput="searchMedicine(this.value)">

    <label class="form-label">Kiske Liye / For Whom</label>

      <option value="Injection">Injection</option>
      <option value="Saline">Saline</option>
      <option value="Cream (Lagane wali)">Cream (Lagane wali)</option>
      <option value="Ointment">Ointment</option>
      <option value="Gel">Gel</option>
      <option value="Spray">Spray</option>
      <option value="Inhaler (Sungne wali)">Inhaler (Sungne wali)</option>
      <option value="Powder">Powder</option>
      <option value="Lotion">Lotion</option>

    <label class="form-label">Quantity / कितनी लेनी है</label>
    <input id="medicineQty" type="text" placeholder="e.g., 1 tablet, 5ml, 2 drops" class="form-input">

    <label class="form-label">Time</label>
    <select id="medicineTimeSelect" class="form-input">

      <option value="08:00">8:00 AM</option>
      <option value="09:00">9:00 AM</option>
      <option value="12:00">12:00 PM</option>
      <option value="14:00">2:00 PM</option>
      <option value="16:00">4:00 PM</option>
      <option value="18:00">6:00 PM</option>
      <option value="20:00">8:00 PM</option>
      <option value="21:00">9:00 PM</option>
      <option value="22:00">10:00 PM</option>

    <label class="form-label">Before / After Food</label>

      <option value="Before Food">Before Food (Khane se pehle)</option>

      <option value="Empty Stomach">Empty Stomach (Khali pet)</option>
      <option value="Not Applicable">Not Applicable</option>

    <div class="flex gap-2 mt-5">
      <button onclick="saveMedicine()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg">Save</button>
      <button onclick="closeMedicineModal()" class="flex-1 bg-slate-300 hover:bg-slate-400 text-slate-700 font-semibold py-3 rounded-lg">Cancel</button>
    </div>
  </div>
</div>

const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const dayNamesHi = ['रविवार', 'सोमवार', 'मंगलवार', 'बुधवार', 'गुरुवार', 'शुक्रवार', 'शनिवार'];

function toggleLanguage() {
  currentLang = currentLang === 'en' ? 'hi' : 'en';
  document.getElementById('langBtn').textContent = currentLang === 'en' ? 'हिंदी' : 'English';
  document.querySelectorAll('.lang').forEach(el => {
    el.textContent = el.getAttribute('data-' + currentLang) || el.textContent;
  });
  document.getElementById('timelineDay').textContent = currentLang === 'hi' ? dayNamesHi[selectedDay] : dayNames[selectedDay];
}

function saveProfile() {
  const name = document.getElementById('seniorName').value.trim();
  const age = document.getElementById('seniorAge').value.trim();
  if (!name) return alert('Please enter name');
  localStorage.setItem('seniorProfile', JSON.stringify({ name, age }));
  const status = document.getElementById('profileStatus');
  status.classList.remove('hidden');
  setTimeout(() => status.classList.add('hidden'), 2000);
}

function setDay(dayIndex) {
  selectedDay = dayIndex;
  for (let i = 0; i < 7; i++) {
    const btn = document.getElementById('day-' + i);
    if (i === dayIndex) btn.className = 'day-btn bg-blue-600 text-white';
    else btn.className = 'day-btn bg-slate-200 text-slate-700';
  }
  document.getElementById('timelineDay').textContent = currentLang === 'hi' ? dayNamesHi[dayIndex] : dayNames[dayIndex];
  renderMedicines();
}

window.onload = () => {
  const p = JSON.parse(localStorage.getItem('seniorProfile') || 'null');
  if (p) {
    document.getElementById('seniorName').value = p.name || '';
    document.getElementById('seniorAge').value = p.age || '';
  }
  setDay(new Date().getDay());
  renderTasks();
};

function addMedicine() {
  document.getElementById('medicineModal').classList.remove('hidden');
  document.getElementById('medicineModal').classList.add('flex');
  document.getElementById('medicineSearch').value = '';
  document.getElementById('medicineQty').value = '';
  document.getElementById('suggestions').innerHTML = '<p class="text-slate-400 p-2">Type 2 letters...</p>';
  tempMedicineName = '';
}
function closeMedicineModal() {
  document.getElementById('medicineModal').classList.add('hidden');
  document.getElementById('medicineModal').classList.remove('flex');
}
function searchMedicine(query) {
  const suggestions = document.getElementById('suggestions');
  suggestions.innerHTML = '';
  if (query.length < 2) {
    suggestions.innerHTML = '<p class="text-slate-400 p-2">Type 2 letters...</p>';
    return;
  }
  const q = query.toLowerCase();
  const matches = medicineDatabase.filter(m => m.toLowerCase().includes(q)).slice(0, 10);
  if (matches.length === 0) {
    const div = document.createElement('div');
    div.className = 'suggestion-item';
    div.innerHTML = `➕ Add "${query}" (custom)`;
    div.onclick = () => {
      tempMedicineName = query;
      document.getElementById('medicineSearch').value = query;
      suggestions.innerHTML = '<p class="text-green-600 p-2">✅ Selected</p>';
    };
    suggestions.appendChild(div);
    return;
  }
  matches.forEach(name => {
    const div = document.createElement('div');
    div.className = 'suggestion-item';
    div.innerHTML = `💊 ${name}`;
    div.onclick = () => {
      tempMedicineName = name;
      document.getElementById('medicineSearch').value = name;
      suggestions.innerHTML = '<p class="text-green-600 p-2">✅ Selected</p>';
    };
    suggestions.appendChild(div);
  });
}

function saveMedicine() {
  const name = tempMedicineName || document.getElementById('medicineSearch').value.trim();
  const qty = document.getElementById('medicineQty').value.trim();
  const time = document.getElementById('medicineTimeSelect').value;
  const food = document.getElementById('medicineFood').value;
  const forWhom = document.getElementById('medicineFor').value;
  const area = document.getElementById('medicineArea').value;
  const form = document.getElementById('medicineForm').value;
  if (!name) return alert('Please select a medicine');
  if (!qty) return alert('Please enter quantity');
  medicines.push({ id: Date.now(), name, qty, time, food, forWhom, area, form, day: selectedDay, taken: false });
  saveMedicines(); renderMedicines(); closeMedicineModal();
}

function toggleMedicine(id) {
  const m = medicines.find(x => x.id === id);
  if (m) m.taken = !m.taken;
  saveMedicines(); renderMedicines();
}
function deleteMedicine(id) {
  medicines = medicines.filter(x => x.id !== id);
  saveMedicines(); renderMedicines();
}
function saveMedicines() { localStorage.setItem('medicines', JSON.stringify(medicines)); }

function renderMedicines() {
  const lists = {
    morning: document.getElementById('morningList'),
    afternoon: document.getElementById('afternoonList'),
    evening: document.getElementById('eveningList'),
    night: document.getElementById('nightList')
  };
  Object.values(lists).forEach(l => l.innerHTML = '');
  const dayMeds = medicines.filter(m => m.day === selectedDay);
  const empty = document.getElementById('noMedicine');
  if (dayMeds.length === 0) { empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  dayMeds.sort((a, b) => parseInt(a.time) - parseInt(b.time));
  dayMeds.forEach(m => {
    const hour = parseInt(m.time);
    let target;
    if (hour < 12) target = lists.morning;
    else if (hour < 17) target = lists.afternoon;
    else if (hour < 21) target = lists.evening;
    else target = lists.night;
    const div = document.createElement('div');
    div.className = `p-3 rounded-xl border-2 ${m.taken ? 'bg-green-50 border-green-300' : 'bg-slate-50 border-slate-200'}`;
    div.innerHTML = `
      <div class="flex justify-between items-start">
        <div class="flex-1">
          <p class="font-semibold text-sm ${m.taken ? 'line-through text-green-700' : 'text-slate-800'}">${m.name}</p>
          <p class="text-xs text-slate-500 mt-1">⏰ ${m.time} • 💊 ${m.qty} • 🍽️ ${m.food}</p>
          <p class="text-xs text-slate-500 mt-1">👤 ${m.forWhom} • 📍 ${m.area} • 💉 ${m.form}</p>
        </div>
        <div class="flex gap-1 ml-2">
          <button onclick="toggleMedicine(${m.id})" class="px-3 py-1 rounded-lg font-semibold text-white text-xs ${m.taken ? 'bg-slate-400' : 'bg-green-600'}">${m.taken ? 'Undo' : 'Taken'}</button>
          <button onclick="deleteMedicine(${m.id})" class="px-2 py-1 rounded-lg bg-red-100 text-red-600 text-xs">✕</button>
        </div>
      </div>`;
    target.appendChild(div);
  });
}

function addTask() {
  const title = prompt('Task:');
  if (!title) return;
  tasks.push({ id: Date.now(), title, done: false });
  saveTasks(); renderTasks();
}
function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (t) t.done = !t.done;
  saveTasks(); renderTasks();
}
function deleteTask(id) {
  tasks = tasks.filter(x => x.id !== id);
  saveTasks(); renderTasks();
}
function saveTasks() { localStorage.setItem('tasks', JSON.stringify(tasks)); }
function renderTasks() {
  const list = document.getElementById('taskList');
  const empty = document.getElementById('noTask');
  list.innerHTML = '';
  if (tasks.length === 0) { empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  tasks.forEach(t => {
    const div = document.createElement('div');
    div.className = `flex items-center justify-between p-3 rounded-xl border-2 ${t.done ? 'bg-green-50 border-green-300' : 'bg-slate-50 border-slate-200'}`;
    div.innerHTML = `
      <p class="font-semibold text-sm ${t.done ? 'line-through text-green-700' : 'text-slate-800'}">${t.title}</p>
      <div class="flex gap-1">
        <button onclick="toggleTask(${t.id})" class="px-3 py-1 rounded-lg font-semibold text-white text-xs ${t.done ? 'bg-slate-400' : 'bg-blue-600'}">${t.done ? 'Undo' : 'Done'}</button>
        <button onclick="deleteTask(${t.id})" class="px-2 py-1 rounded-lg bg-red-100 text-red-600 text-xs">✕</button>
      </div>`;
    list.appendChild(div);
  });
}

function emergencyAlert() {
  const p = JSON.parse(localStorage.getItem('seniorProfile') || 'null');
  const name = p?.name || 'Senior';
  const msg = `🚨 EMERGENCY ALERT!\n\n${name} needs immediate help.\n\nTime: ${new Date().toLocaleString('en-IN')}`;
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
  alert(msg);
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('🚨 EMERGENCY ALERT', { body: `${name} needs help!` });
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
